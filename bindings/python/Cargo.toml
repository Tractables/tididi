[package]
name = "tididi-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Python bindings for Tree Decision Diagrams"
repository = "https://github.com/Tractables/tididi"
publish = false
readme = "README.rst"

[lib]
name = "_tididi"
crate-type = ["cdylib"]

[dependencies]
tididi = { path = "../.." }
pyo3 = { version = "0.28.2", features = ["abi3-py310", "num-bigint", "num-rational"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
