<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
<title id="title">Two vtrees for the same equality constraints</title>
<desc id="desc">On the left, x1 and x3 share a parent, as do x2 and x4. On the right, each equality is split between the root's two subtrees.</desc>
<rect width="760" height="240" rx="12" fill="#f7f9fc"/>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#18354d">
<text x="190" y="32" font-size="18" font-weight="600">Equalities grouped</text>
<path d="M190 65 L115 120" stroke="#7890a3" stroke-width="2" fill="none"/>
<path d="M190 65 L265 120" stroke="#7890a3" stroke-width="2" fill="none"/>
<path d="M115 120 L70 182" stroke="#7890a3" stroke-width="2" fill="none"/>
<path d="M115 120 L160 182" stroke="#7890a3" stroke-width="2" fill="none"/>
<path d="M265 120 L220 182" stroke="#7890a3" stroke-width="2" fill="none"/>
<path d="M265 120 L310 182" stroke="#7890a3" stroke-width="2" fill="none"/>
<circle cx="190" cy="65" r="6" fill="#2774ae"/>
<circle cx="115" cy="120" r="6" fill="#2774ae"/>
<circle cx="265" cy="120" r="6" fill="#2774ae"/>
<circle cx="70" cy="182" r="7" fill="#2774ae"/><text x="70" y="213" font-size="18">x1</text>
<circle cx="160" cy="182" r="7" fill="#2774ae"/><text x="160" y="213" font-size="18">x3</text>
<circle cx="220" cy="182" r="7" fill="#b98500"/><text x="220" y="213" font-size="18">x2</text>
<circle cx="310" cy="182" r="7" fill="#b98500"/><text x="310" y="213" font-size="18">x4</text>
<text x="570" y="32" font-size="18" font-weight="600">Equalities split</text>
<path d="M570 65 L495 120" stroke="#7890a3" stroke-width="2" fill="none"/>
<path d="M570 65 L645 120" stroke="#7890a3" stroke-width="2" fill="none"/>
<path d="M495 120 L450 182" stroke="#7890a3" stroke-width="2" fill="none"/>
<path d="M495 120 L540 182" stroke="#7890a3" stroke-width="2" fill="none"/>
<path d="M645 120 L600 182" stroke="#7890a3" stroke-width="2" fill="none"/>
<path d="M645 120 L690 182" stroke="#7890a3" stroke-width="2" fill="none"/>
<circle cx="570" cy="65" r="6" fill="#2774ae"/>
<circle cx="495" cy="120" r="6" fill="#2774ae"/>
<circle cx="645" cy="120" r="6" fill="#2774ae"/>
<circle cx="450" cy="182" r="7" fill="#2774ae"/><text x="450" y="213" font-size="18">x1</text>
<circle cx="540" cy="182" r="7" fill="#b98500"/><text x="540" y="213" font-size="18">x2</text>
<circle cx="600" cy="182" r="7" fill="#2774ae"/><text x="600" y="213" font-size="18">x3</text>
<circle cx="690" cy="182" r="7" fill="#b98500"/><text x="690" y="213" font-size="18">x4</text>
</g></svg>
