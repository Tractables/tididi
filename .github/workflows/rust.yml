name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # The toolchain (channel + components) is pinned by rust-toolchain.toml,
    # which rustup honors automatically on the first cargo invocation. The crate
    # is pure Rust with no C/C++ dependencies and no special linker, so nothing
    # else needs installing.
    - name: Build
      run: cargo build --workspace --verbose
    - name: Check release profile
      run: cargo check --release --workspace
    - name: Test
      env:
        RUST_BACKTRACE: full
      run: cargo test --workspace --all-targets --verbose
    - name: Documentation tests
      run: cargo test --workspace --doc
    - name: Run consumer examples
      run: |
        cargo run --example probabilistic_query
        cargo run --example symbolic_reachability
    - name: Lints
      run: cargo clippy --workspace --all-targets -- -D warnings
    # Code the release profile leaves out, and code it leaves in that a debug
    # build leaves out, are both invisible to the lint run above.
    - name: Lints, release profile
      run: cargo clippy --release --workspace --all-targets -- -D warnings
    - name: Documentation
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps
    # The randomized differential suite draws until its time is up and is
    # ignored by default, so the runs above never reach it. Twenty seconds in
    # each profile: the release run for the answers, the debug run for the
    # invariant checkers, which only that profile compiles. The seed comes from
    # the clock and is printed with the first case.
    - name: Differential sweep, release profile
      env:
        TIDIDI_FUZZ_SECONDS: 20
      run: cargo test --release --test differential -- --ignored
    - name: Differential sweep, debug profile
      env:
        TIDIDI_FUZZ_SECONDS: 20
        RUST_BACKTRACE: full
      run: cargo test --test differential -- --ignored
    # Builds the crate from the tarball a publish would upload, so a file the
    # package leaves out or a path the manifest gets wrong fails here.
    - name: Package
      run: cargo package

  # Compares the public API against the last released version and reports the
  # version bump the change needs. The baseline is the previous tag, so the job
  # is inert until the first tag exists: with no tag the lookup finds nothing,
  # the step reports that and succeeds, and the job starts checking on its own
  # the first time a release is tagged.
  semver:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Find the previous tag
      id: previous
      run: echo "tag=$(git tag --sort=-creatordate | head -n 1)" >> "$GITHUB_OUTPUT"
    - name: Install the checker
      if: steps.previous.outputs.tag != ''
      run: cargo install cargo-semver-checks --locked
    - name: Compare the public API with the previous tag
      if: steps.previous.outputs.tag != ''
      run: cargo semver-checks --baseline-rev "${{ steps.previous.outputs.tag }}"
    - name: Report that there is nothing to compare with
      if: steps.previous.outputs.tag == ''
      run: echo "No tag in the repository yet, so there is no released version to compare against."

  # The oldest toolchain the crate supports, declared as `rust-version` in
  # Cargo.toml. rust-toolchain.toml would otherwise pull every cargo call in
  # this directory back onto the pinned channel, so each command names the
  # toolchain explicitly. Clippy and the doc build stay on the pinned
  # toolchain above; this job checks that the crate and its tests compile and
  # pass on the floor.
  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.88
    - name: Report the toolchain in use
      run: cargo +1.88 --version --verbose
    - name: Build
      run: cargo +1.88 build --all-targets --verbose
    - name: Test
      env:
        RUST_BACKTRACE: full
      run: cargo +1.88 test --all-targets --verbose
    - name: Documentation tests
      run: cargo +1.88 test --doc
