name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Test
      env:
        RUST_BACKTRACE: full
      run: cargo test --locked --all-targets --verbose
    - name: Documentation tests
      run: cargo test --locked --doc
    - name: Run consumer examples
      run: |
        for example in examples/*.rs; do
          cargo run --locked --example "$(basename "$example" .rs)"
        done
    - name: Lints
      if: runner.os == 'Linux'
      run: cargo clippy --all-targets -- -D warnings
    - name: Lints, release profile
      if: runner.os == 'Linux'
      run: cargo clippy --release --all-targets -- -D warnings
    - name: Documentation
      if: runner.os == 'Linux'
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps
    - name: Check rendered documentation
      if: runner.os == 'Linux'
      run: |
        python3 tests/rendered_docs.py --self-test
        python3 tests/rendered_docs.py target/doc
    - name: Prepare documentation site
      if: runner.os == 'Linux' && github.event_name == 'push'
      run: |
        echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=tididi/"><title>tididi documentation</title><a href="tididi/">Open the documentation</a>' > target/doc/index.html
    - name: Upload documentation
      if: runner.os == 'Linux' && github.event_name == 'push'
      uses: actions/upload-pages-artifact@v4
      with:
        path: target/doc
    - name: Differential sweep, release profile
      if: runner.os == 'Linux'
      env:
        TIDIDI_FUZZ_SECONDS: 20
      run: cargo test --release --test differential -- --ignored
    - name: Differential sweep, debug profile
      if: runner.os == 'Linux'
      env:
        TIDIDI_FUZZ_SECONDS: 20
        RUST_BACKTRACE: full
      run: cargo test --test differential -- --ignored
    - name: Package and run standalone examples
      if: runner.os == 'Linux'
      run: |
        cargo package
        python3 tests/package_examples.py --self-test
        python3 tests/package_examples.py

  semver:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Find the previous tag
      id: previous
      run: echo "tag=$(git tag --sort=-creatordate | head -n 1)" >> "$GITHUB_OUTPUT"
    - name: Install the checker
      if: steps.previous.outputs.tag != ''
      run: cargo install cargo-semver-checks --locked
    - name: Compare the public API with the previous tag
      if: steps.previous.outputs.tag != ''
      run: cargo semver-checks --baseline-rev "${{ steps.previous.outputs.tag }}"
    - name: Report that there is nothing to compare with
      if: steps.previous.outputs.tag == ''
      run: echo "No tag in the repository yet, so there is no released version to compare against."

  miri:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri
    # The tests that reach the crate's unsafe code: the fast count and weight
    # reads through `get_unchecked`, the twin-table walks, and the pair views
    # that reinterpret a node as a pair. Miri interprets rather than executes,
    # so the set is chosen for what it covers per second: these twelve take
    # about thirteen seconds, where adding the exhaustive sorting-network
    # permutation test alone takes twelve minutes.
    - name: Interpret the tests over unsafe code
      run: cargo miri test --lib -- reduce::contract::fingerprint value::domain

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.88
    - name: Report the toolchain in use
      run: cargo +1.88 --version --verbose
    - name: Build
      run: cargo +1.88 build --all-targets --verbose
    - name: Test
      env:
        RUST_BACKTRACE: full
      run: cargo +1.88 test --all-targets --verbose
    - name: Documentation tests
      run: cargo +1.88 test --doc

  documentation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, msrv]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: documentation
      cancel-in-progress: true
    steps:
    - name: Publish documentation
      id: deployment
      uses: actions/deploy-pages@v4
