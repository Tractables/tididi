name: Rust and bindings

on:
  push:
    branches: [ "main" ]
  release:
    types: [published]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  documentation-scenarios:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Check shared teaching scenarios
      run: |
        python3 -m unittest discover -s tests -p test_scenarios.py
        python3 scripts/check_scenarios.py

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Test
      env:
        RUST_BACKTRACE: full
      run: cargo test --locked --all-targets --verbose
    - name: Documentation tests
      run: cargo test --locked --doc
    - name: Run consumer examples
      # On Linux the packaged-example step below runs them.
      if: runner.os != 'Linux'
      run: |
        for example in examples/*.rs; do
          cargo run --locked --example "$(basename "$example" .rs)"
        done
    - name: Lints
      if: runner.os == 'Linux'
      run: cargo clippy --all-targets -- -D warnings
    - name: Lints, release profile
      if: runner.os == 'Linux'
      run: cargo clippy --release --all-targets -- -D warnings
    - name: Documentation
      if: runner.os == 'Linux'
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps
    - name: Check rendered documentation
      if: runner.os == 'Linux'
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        python3 tests/rendered_docs.py --self-test
        python3 tests/rendered_docs.py target/doc --unbundled
        python3 scripts/prepare_docs.py target/doc --release-tag "$RELEASE_TAG"
        python3 tests/rendered_docs.py target/doc
    - name: Save Rust documentation
      if: runner.os == 'Linux' && github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: rust-documentation
        path: target/doc
    - name: Differential sweep, release profile
      if: runner.os == 'Linux'
      env:
        TIDIDI_FUZZ_SECONDS: 20
      run: cargo test --release --test differential -- --ignored
    - name: Differential sweep, debug profile
      if: runner.os == 'Linux'
      env:
        TIDIDI_FUZZ_SECONDS: 20
        RUST_BACKTRACE: full
      run: cargo test --test differential -- --ignored
    - name: Package and run standalone examples
      if: runner.os == 'Linux'
      run: |
        cargo package
        python3 tests/package_examples.py --self-test
        python3 tests/package_examples.py

  semver:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Find the previous tag
      id: previous
      run: echo "tag=$(git tag --sort=-creatordate | head -n 1)" >> "$GITHUB_OUTPUT"
    - name: Install the checker
      if: steps.previous.outputs.tag != ''
      run: cargo install cargo-semver-checks --locked
    - name: Compare the public API with the previous tag
      if: steps.previous.outputs.tag != ''
      run: cargo semver-checks --baseline-rev "${{ steps.previous.outputs.tag }}"
    - name: Report that there is nothing to compare with
      if: steps.previous.outputs.tag == ''
      run: echo "No tag in the repository yet, so there is no released version to compare against."

  miri:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri
    # Small tests at the unsafe lookup, pair-view and reused-column boundaries.
    - name: Interpret the tests over unsafe code
      run: cargo +nightly miri test --lib -- reduce::contract::fingerprint value::domain conjoin::child_lookup::tests conjoin::cell::tests::processing::columns

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.88
    - name: Report the toolchain in use
      run: cargo +1.88 --version --verbose
    - name: Test
      env:
        RUST_BACKTRACE: full
      run: cargo +1.88 test --all-targets --verbose
    - name: Documentation tests
      run: cargo +1.88 test --doc
    - name: C binding minimum-version checks
      run: cargo +1.88 test --locked --manifest-path bindings/c/Cargo.toml

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10"]
        include:
          - os: ubuntu-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Build wheel
      uses: PyO3/maturin-action@v1
      with:
        command: build
        args: --release --locked --manifest-path bindings/python/Cargo.toml --out dist --interpreter ${{ runner.os == 'Linux' && format('python{0}', matrix.python) || 'python' }}
        manylinux: "2_28"
        rust-toolchain: "1.94.0"
    - name: Test installed wheel
      run: |
        python -m pip install pytest dist/*.whl
        python -m pytest bindings/python/tests -q
    - name: Check binding source
      if: runner.os == 'Linux' && matrix.python == '3.10'
      run: cargo clippy --locked --manifest-path bindings/python/Cargo.toml -- -D warnings
    - name: Build and test the Python guide
      if: runner.os == 'Linux' && matrix.python == '3.10'
      run: |
        for wheel in dist/*.whl; do python -m pip install "${wheel}[docs]"; done
        python -m sphinx -W --keep-going -b html -d target/python-docs-cache bindings/python/docs target/python-docs
        python -m sphinx -W --keep-going -b doctest bindings/python/docs target/python-doctests
    - name: Test the source distribution
      if: runner.os == 'Linux' && matrix.python == '3.10'
      run: |
        python -m pip install 'maturin>=1.9.4,<2'
        maturin sdist --manifest-path bindings/python/Cargo.toml --out dist
        python -m pip install --force-reinstall dist/*.tar.gz
        python -m pytest bindings/python/tests -q
    - name: Save Python documentation
      if: runner.os == 'Linux' && matrix.python == '3.10' && github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: python-documentation
        path: target/python-docs
    - name: Save wheels and source archive
      uses: actions/upload-artifact@v4
      with:
        name: python-${{ matrix.os }}-${{ matrix.python }}
        path: dist

  c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Build and test C, C++, and the installed package
      if: runner.os != 'Linux'
      run: python bindings/c/check.py
    - name: Build and test C, C++, the installed package and the executable guide
      if: runner.os == 'Linux'
      run: |
        python -m pip install -r bindings/c/docs/requirements.txt
        python bindings/c/check.py --docs
    - name: Check the Rust ownership boundary
      if: runner.os == 'Linux'
      run: |
        cargo test --locked --manifest-path bindings/c/Cargo.toml
        cargo clippy --locked --manifest-path bindings/c/Cargo.toml --all-targets -- -D warnings
    - name: Check native memory ownership
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind
        valgrind --leak-check=full --errors-for-leak-kinds=definite,indirect --error-exitcode=99 bindings/c/build/bin/consumer
        for source in bindings/c/examples/*.c; do
          valgrind --leak-check=full --errors-for-leak-kinds=definite,indirect --error-exitcode=99 "bindings/c/build/bin/$(basename "$source" .c)"
        done
    - name: Save C documentation
      if: runner.os == 'Linux' && github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: c-documentation
        path: bindings/c/build/docs
    - name: Save the native package
      uses: actions/upload-artifact@v4
      with:
        name: c-${{ matrix.os }}
        path: bindings/c/build/package

  documentation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, msrv, python, c, documentation-scenarios]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: documentation
      cancel-in-progress: true
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rust-documentation
        path: site
    - uses: actions/download-artifact@v4
      with:
        name: python-documentation
        path: site/python
    - uses: actions/download-artifact@v4
      with:
        name: c-documentation
        path: site/c
    - uses: actions/upload-pages-artifact@v4
      with:
        path: site
    - name: Publish documentation
      id: deployment
      uses: actions/deploy-pages@v4

  release-documentation:
    if: github.event_name == 'release'
    needs: [build, msrv, python, c, documentation-scenarios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-documentation-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rust-documentation
        path: documentation
    - uses: actions/download-artifact@v4
      with:
        name: python-documentation
        path: documentation/python
    - uses: actions/download-artifact@v4
      with:
        name: c-documentation
        path: documentation/c
    - name: Archive the documentation
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        cd documentation
        zip -q -r "../tididi-docs-${RELEASE_TAG}.zip" .
    - name: Attach the snapshot to the release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      # No --clobber: rerunning this job must not replace a published snapshot.
      run: gh release upload "$RELEASE_TAG" "tididi-docs-${RELEASE_TAG}.zip"
