name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - name: Build
      if: runner.os == 'Linux'
      run: cargo build --verbose
    - name: Check release profile
      if: runner.os == 'Linux'
      run: cargo check --release
    - name: Test
      env:
        RUST_BACKTRACE: full
      run: cargo test --all-targets --verbose
    - name: Documentation tests
      run: cargo test --doc
    - name: Run consumer examples
      run: |
        cargo run --example build_minimize_count
        cargo run --example probabilistic_query
        cargo run --example symbolic_reachability
        cargo run --example statistic
        cargo run --example save_reload
        cargo run --example vtree_grouping
        cargo run --example minimum_cost
    - name: Lints
      if: runner.os == 'Linux'
      run: cargo clippy --all-targets -- -D warnings
    - name: Lints, release profile
      if: runner.os == 'Linux'
      run: cargo clippy --release --all-targets -- -D warnings
    - name: Documentation
      if: runner.os == 'Linux'
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps
    - name: Check rendered documentation
      if: runner.os == 'Linux'
      run: |
        python3 tests/rendered_docs.py --self-test
        python3 tests/rendered_docs.py target/doc
    - name: Prepare documentation site
      if: runner.os == 'Linux' && github.event_name == 'push'
      run: |
        echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=tididi/"><title>tididi documentation</title><a href="tididi/">Open the documentation</a>' > target/doc/index.html
    - name: Upload documentation
      if: runner.os == 'Linux' && github.event_name == 'push'
      uses: actions/upload-pages-artifact@v4
      with:
        path: target/doc
    - name: Differential sweep, release profile
      if: runner.os == 'Linux'
      env:
        TIDIDI_FUZZ_SECONDS: 20
      run: cargo test --release --test differential -- --ignored
    - name: Differential sweep, debug profile
      if: runner.os == 'Linux'
      env:
        TIDIDI_FUZZ_SECONDS: 20
        RUST_BACKTRACE: full
      run: cargo test --test differential -- --ignored
    - name: Package and run standalone examples
      if: runner.os == 'Linux'
      run: |
        cargo package
        python3 tests/package_examples.py

  semver:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Find the previous tag
      id: previous
      run: echo "tag=$(git tag --sort=-creatordate | head -n 1)" >> "$GITHUB_OUTPUT"
    - name: Install the checker
      if: steps.previous.outputs.tag != ''
      run: cargo install cargo-semver-checks --locked
    - name: Compare the public API with the previous tag
      if: steps.previous.outputs.tag != ''
      run: cargo semver-checks --baseline-rev "${{ steps.previous.outputs.tag }}"
    - name: Report that there is nothing to compare with
      if: steps.previous.outputs.tag == ''
      run: echo "No tag in the repository yet, so there is no released version to compare against."

  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.88
    - name: Report the toolchain in use
      run: cargo +1.88 --version --verbose
    - name: Build
      run: cargo +1.88 build --all-targets --verbose
    - name: Test
      env:
        RUST_BACKTRACE: full
      run: cargo +1.88 test --all-targets --verbose
    - name: Documentation tests
      run: cargo +1.88 test --doc

  documentation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, msrv]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: documentation
      cancel-in-progress: true
    steps:
    - name: Publish documentation
      id: deployment
      uses: actions/deploy-pages@v4
