name: Python release

# Builds the Python wheels and source archive, tests them, and on request
# publishes them to PyPI through trusted publishing (no stored token).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to PyPI after the build and tests pass"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Build wheel
      uses: PyO3/maturin-action@v1
      with:
        command: build
        target: ${{ matrix.target }}
        args: --release --locked --manifest-path bindings/python/Cargo.toml --out dist --interpreter ${{ runner.os == 'Linux' && 'python3.10' || 'python' }}
        manylinux: "2_28"
        rust-toolchain: "1.94.0"
    - name: Test installed wheel
      run: |
        python -m pip install pytest dist/*.whl
        python -m pytest bindings/python/tests -q
    - uses: actions/upload-artifact@v4
      with:
        name: wheel-${{ matrix.os }}-${{ matrix.target }}
        path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Build and test the source archive
      run: |
        python -m pip install 'maturin>=1.9.4,<2' pytest
        maturin sdist --manifest-path bindings/python/Cargo.toml --out dist
        python -m pip install dist/*.tar.gz
        python -m pytest bindings/python/tests -q
    - uses: actions/upload-artifact@v4
      with:
        name: sdist
        path: dist/*.tar.gz

  publish:
    if: inputs.publish
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Check the distributions
      run: |
        python -m pip install twine
        python -m twine check --strict dist/*
    - uses: pypa/gh-action-pypi-publish@release/v1
