[package]
name = "tididi"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Tree Decision Diagrams: canonical vtree-shaped decision diagrams for Boolean functions, with model counting and semiring evaluation"
license = "Apache-2.0"
repository = "https://github.com/Tractables/tididi"
homepage = "https://github.com/Tractables/tididi"
documentation = "https://docs.rs/tididi"
readme = "README.md"
keywords = ["decision-diagram", "model-counting", "knowledge-compilation", "bdd", "wmc"]
categories = ["science", "algorithms", "data-structures"]
# The package ships the sources, the guides, the examples, README and LICENSE;
# repository housekeeping stays out of it.
exclude = [".github/", ".gitignore", "CLAUDE.md", "rust-toolchain.toml"]

[lib]
name = "tididi"

# No cargo features, no build.rs, no environment reads, no allocator
# dependency: runtime configuration arrives as installed data (tdd::limits).
[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
rand = "0.10"
rustc-hash = "2"
itoa = "1"
libc = "0.2"
smallvec = { version = "1", features = ["union"] }
