[package]
name = "tididi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Tree Decision Diagrams: canonical vtree-shaped decision diagrams for Boolean functions, with model counting and semiring evaluation"
license = "Apache-2.0"
repository = "https://github.com/Tractables/tididi"
documentation = "https://docs.rs/tididi/0.1.0/tididi/"
readme = "README.md"
keywords = ["decision-diagram", "model-counting", "knowledge-compilation", "bdd", "wmc"]
categories = ["science", "algorithms", "data-structures"]
exclude = ["bindings/", ".github/", ".gitignore", "CLAUDE.md", "AGENTS.md", "rust-toolchain.toml"]

[features]
# The oracles, generators and invariant checkers under `test_helpers`. On for
# this crate's own tests through the dev-dependency below; off for a consumer,
# whose release build then does not compile them at all.
testing = []

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
rustc-hash = "2"
itoa = "1"
smallvec = { version = "1", features = ["union"] }

[dev-dependencies]
# The crate's own tests, examples and doctests build against it as a consumer
# would, so this is how they reach `test_helpers`.
tididi = { path = ".", features = ["testing"] }
